---
- name: configuring tomcat
  hosts: all
  tasks: 
   - name: installing tomcat10
     apt:
      name: tomcat10
      state: present
      update_cache: yes
   - name: installing tomcat10-admin
     apt:
      name: tomcat10-admin
      state: present
      update_cache: yes
   - name: copy customized tomcat-users.xml file
     copy:
      src: tomcat-users.xml
      dest: /etc/tomcat10
   - name: changing port no. 9090 to 8080
     replace:
      regexp: 9090
      replace: 8080
      path: /etc/tomcat10/server.xml
   - name: restarting service
     service:
      name: tomcat10
      state: restarted
   - name: pause for 40 seconds
     pause:
       seconds: 40    
   - name: checking tomcat url on server1
     uri:
       url: http://172.31.24.168:8080
       status_code: 200
   - name: checking tomcat url on server2
     uri:
       url: http://172.31.19.197:8080   
       status_code: 200   
...      
